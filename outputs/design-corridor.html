<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>设计成果走廊</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020202;cursor:none;user-select:none}
    body{font-family:Georgia,"Noto Serif SC",serif;color:#d7bd83}
    .viewport{position:fixed;inset:0;overflow:hidden;background:#000}
    .stage{position:absolute;left:0;top:0;width:calc(4337 / 941 * 100vh);height:100vh;will-change:transform}
    .corridor{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
    .bright{opacity:0;transition:opacity 1.1s ease}.stage.lit .bright{opacity:1}
    .web{position:absolute;z-index:5;left:0;top:0;width:11.8%;height:auto;pointer-events:none;filter:brightness(.68);opacity:.9}
    .lamp{position:absolute;z-index:6;width:3.55%;height:auto;transform:translate(-50%,-50%);opacity:0;transition:opacity .55s ease;pointer-events:none}
    .stage.lit .lamp{opacity:1}
    .lamp1{left:5.15%;top:50.7%}.lamp2{left:35.87%;top:50.7%}.lamp3{left:66.80%;top:50.7%}.lamp4{left:97.90%;top:50.7%}
    .switchTarget{position:absolute;z-index:15;left:95.85%;top:36.2%;width:4.1%;height:29%;cursor:none;border:0;background:transparent}
    .switchTarget:focus-visible{outline:2px solid #c9a35a;outline-offset:5px}
    .darkness{--x:50vw;--y:50vh;position:fixed;z-index:20;inset:0;pointer-events:none;background:#000;
      -webkit-mask:radial-gradient(circle 155px at var(--x) var(--y),transparent 0 30%,#0004 52%,#000 100%);
      mask:radial-gradient(circle 155px at var(--x) var(--y),transparent 0 30%,#0004 52%,#000 100%);transition:opacity .85s ease}
    .viewport.lit .darkness{opacity:0}
    .cursorCandle{position:fixed;z-index:30;width:82px;height:auto;left:0;top:0;pointer-events:none;transform:translate(-50%,-2%);filter:drop-shadow(0 0 12px #ffad32) drop-shadow(0 10px 12px #000b)}
    .viewport.lit .cursorCandle{filter:drop-shadow(0 8px 9px #0009)}
    .back{position:fixed;z-index:40;left:24px;top:22px;padding:10px 14px;border:1px solid #765b2c;background:#120e09c7;color:#d9bc7b;text-decoration:none;cursor:pointer;letter-spacing:.15em;font-size:12px}
    .hint{position:fixed;z-index:25;right:26px;bottom:22px;margin:0;font-size:11px;letter-spacing:.18em;color:#c7aa72;opacity:.72;pointer-events:none;transition:opacity .5s}
    .viewport.lit .hint{opacity:0}
    .introCard{position:absolute;z-index:14;top:42.2%;width:1.55%;height:10.3%;padding:0;border:1px solid #d8c69a;background:#b79a60;box-shadow:0 6px 13px #000b;cursor:none;overflow:hidden;transition:filter .2s,box-shadow .2s,transform .2s}
    .introCard img{display:block;width:100%;height:100%;object-fit:cover}.introCard:hover,.introCard:focus-visible{filter:brightness(1.18);box-shadow:0 0 15px #e6c77a99,0 7px 15px #000c;transform:translateY(-3px)}
    .artHotspot{position:absolute;z-index:13;top:8.8%;width:9.2%;height:58%;border:0;background:transparent;cursor:none}.artHotspot:focus-visible{outline:2px solid #d2af68;outline-offset:-8px}
    .artModal{position:fixed;z-index:100;inset:0;display:none;align-items:center;justify-content:center;background:transparent;cursor:default}.artModal.show{display:flex}.artModal.introView,.artModal.linkView{background:#00000073}.artModal img{display:block;max-width:92vw;max-height:88vh;object-fit:contain;filter:drop-shadow(0 18px 28px #000)}.artModal.linkView>img{width:100vw;height:100vh;max-width:none;max-height:none;object-fit:cover;filter:none}
    .artClose{position:fixed;z-index:102;right:28px;top:24px;width:58px;height:58px;border:1px solid #af8c4e;background:#171009e8;color:#e2c681;font:36px/1 Georgia,serif;cursor:pointer}
    @media (max-height:650px){.cursorCandle{width:64px}.darkness{-webkit-mask:radial-gradient(circle 125px at var(--x) var(--y),transparent 0 30%,#0004 52%,#000 100%);mask:radial-gradient(circle 125px at var(--x) var(--y),transparent 0 30%,#0004 52%,#000 100%)}}
  </style>
</head>
<body>
  <main class="viewport" id="viewport">
    <div class="stage" id="stage">
      <img class="corridor dark" src="../personal%20information/src/assets/archive/design/Corridor%20-%20Dark.png" alt="黑暗中的设计成果走廊">
      <img class="corridor bright" src="../personal%20information/src/assets/archive/design/corridor%20-%20bright.png" alt="点亮后的设计成果走廊">
      <img class="web" src="../personal%20information/src/assets/archive/design/pixel-spider-web-climbing-transparent.gif" alt="">
      <img class="lamp lamp1" src="../personal%20information/src/assets/archive/design/pixel-candelabra-flickering-transparent.gif" alt="">
      <img class="lamp lamp2" src="../personal%20information/src/assets/archive/design/pixel-candelabra-flickering-transparent.gif" alt="">
      <img class="lamp lamp3" src="../personal%20information/src/assets/archive/design/pixel-candelabra-flickering-transparent.gif" alt="">
      <img class="lamp lamp4" src="../personal%20information/src/assets/archive/design/pixel-candelabra-flickering-transparent.gif" alt="">
      <button class="switchTarget" id="switchTarget" aria-label="点亮走廊"></button>
    </div>
    <div class="darkness" id="darkness"></div>
    <img class="cursorCandle" id="cursorCandle" src="../personal%20information/src/assets/archive/design/pixel-bronze-candlestick-realistic-flame.gif" alt="">
    <a class="back" href="./personal-archive-new.html">← 返回档案馆</a>
    <p class="hint">移动蜡烛探索走廊 · 点击最右侧墙灯点亮</p>
  </main>
  <script>
    const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),darkness=document.getElementById('darkness'),candle=document.getElementById('cursorCandle'),switchTarget=document.getElementById('switchTarget');
    let pointerX=innerWidth*.72,pointerY=innerHeight*.52,offset=0,targetOffset=0,stageWidth=0,lit=false;
    const measure=()=>{stageWidth=stage.getBoundingClientRect().width;const max=Math.max(0,stageWidth-innerWidth);offset=targetOffset=max;stage.style.transform=`translate3d(${-offset}px,0,0)`};
    const movePointer=(x,y)=>{pointerX=x;pointerY=y;darkness.style.setProperty('--x',x+'px');darkness.style.setProperty('--y',y+'px');candle.style.left=x+'px';candle.style.top=y+'px'};
    addEventListener('pointermove',e=>movePointer(e.clientX,e.clientY));
    addEventListener('resize',()=>{const progress=stageWidth>innerWidth?offset/(stageWidth-innerWidth):1;stageWidth=stage.getBoundingClientRect().width;offset=targetOffset=Math.max(0,stageWidth-innerWidth)*progress});
    addEventListener('wheel',e=>{targetOffset=Math.max(0,Math.min(stageWidth-innerWidth,targetOffset+e.deltaY+e.deltaX));e.preventDefault()},{passive:false});
    function animate(){const edge=.29,ratio=pointerX/innerWidth;let speed=0;if(ratio<edge)speed=-(edge-ratio)/edge*13;else if(ratio>1-edge)speed=(ratio-(1-edge))/edge*13;targetOffset=Math.max(0,Math.min(stageWidth-innerWidth,targetOffset+speed));offset+=(targetOffset-offset)*.105;stage.style.transform=`translate3d(${-offset}px,0,0)`;requestAnimationFrame(animate)}
    switchTarget.addEventListener('click',()=>{
      lit=!lit;
      viewport.classList.toggle('lit',lit);
      stage.classList.toggle('lit',lit);
      switchTarget.setAttribute('aria-label',lit?'关闭走廊灯光':'点亮走廊');
    });
    const designBase='../personal%20information/src/assets/archive/design/',introBase=designBase+'Introduction%20Card/';
    const modal=document.createElement('div');modal.className='artModal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.innerHTML='<button class="artClose" aria-label="Close">×</button><img alt="">';viewport.appendChild(modal);const modalImage=modal.querySelector('img');
    function showImage(src,isLinkView=false){modal.classList.remove('introView','linkView');modal.classList.add(isLinkView?'linkView':'introView','show');modalImage.src=src}
    function hideImage(){modal.classList.remove('show','introView','linkView');modalImage.removeAttribute('src')}
    const introCards=[
      [83.4,'long%201.png','long2.png'],[80.4,'old%20friends%201.png','old%20friends%202.png'],
      [51.5,'fan%201.png','fan%202.png'],[49.1,'rong%201.png','rong%202.png'],
      [21.2,'lvwang%201.png','lvwang%202.png'],[18.8,'jianding%201.png','jianding%202.png']
    ];
    introCards.forEach((item,index)=>{const button=document.createElement('button');button.className='introCard';button.style.left=item[0]+'%';button.setAttribute('aria-label','Open introduction card '+(index+1));button.innerHTML='<img src="'+introBase+item[1]+'" alt="">';button.onclick=()=>showImage(introBase+item[2]);stage.appendChild(button)});
    const artworkActions=[
      [86.0,'image',designBase+'link/long.png'],[71.0,'url','https://mp.weixin.qq.com/s/2vksaZhEVEYhyXH2zPP8_g'],
      [55.1,'image',designBase+'link/xiangcun.png'],[40.1,'image',designBase+'link/zhonlian.png'],
      [24.0,'url','http://www.wupen.org/competitions/127?type=work&entry=20455'],
      [9.0,'url','https://m.mp.oeeee.com/a/BAAFRD0000202607221630284.html?layer=3&share=timeline&isndappinstalled=0']
    ];
    artworkActions.forEach((item,index)=>{const button=document.createElement('button');button.className='artHotspot';button.style.left=item[0]+'%';button.setAttribute('aria-label','Open artwork '+(index+1));button.onclick=()=>item[1]==='image'?showImage(item[2],true):window.open(item[2],'_blank','noopener');stage.appendChild(button)});
    modal.querySelector('.artClose').onclick=hideImage;modal.addEventListener('mousedown',e=>{if(e.target===modal)hideImage()});addEventListener('keydown',e=>{if(e.key==='Escape')hideImage()});
    measure();movePointer(pointerX,pointerY);requestAnimationFrame(animate);
  </script>
</body>
</html>
